<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2K Attendance Dashboard</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<header class="page-header">
  <h1>2K Attendance Dashboard</h1>
  <div class="header-meta">
    <span id="status-pill" class="status-pill status-loading">loading…</span>
    <span id="generated-at" class="generated-at"></span>
  </div>
</header>

<section id="legend" class="legend" aria-label="Status legend"></section>

<main id="teams"></main>

<template id="tmpl-team">
  <section class="team">
    <h2 class="team-label"></h2>
    <p class="team-hint">Scroll right for older weeks. Click a week's header to approve/un-approve it.</p>
    <div class="table-scroll">
      <table class="team-table">
        <thead>
          <tr class="week-header-row"></tr>
          <tr class="dow-row"></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</template>

<script src="/static/dashboard.js"></script>
</body>
</html>
